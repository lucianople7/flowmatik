name = "flowmatik-backend"
main = "server.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "flowmatik-backend-prod"

[[env.production.vars]]
PORT = "8000"
NODE_ENV = "production"

[env.staging]
name = "flowmatik-backend-staging"

[[env.staging.vars]]
PORT = "8000"
NODE_ENV = "staging"
