name = "flowmatik-backend"
main = "workers-server.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "FLOWMATIK_CACHE"
id = "flowmatik_cache_namespace"

[[kv_namespaces]]
binding = "AGENT_MEMORY"
id = "agent_memory_namespace"

[env.production]
name = "flowmatik-backend-prod"
routes = [
  { pattern = "api.flowmatik.co/*", zone_name = "flowmatik.co" }
]

[[env.production.vars]]
PORT = "8000"
NODE_ENV = "production"
FRONTEND_URL = "https://flowmatik.co"

[env.staging]
name = "flowmatik-backend-staging"

[[env.staging.vars]]
PORT = "8000"
NODE_ENV = "staging"
