[build]
  command = "cd flowmatik-frontend && npm install && npm run build"
  publish = "flowmatik-frontend/dist"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"

[[redirects]]
  from = "/api/*"
  to = "https://flowmatik-backend.lucianople7.workers.dev/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
